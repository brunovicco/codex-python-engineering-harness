name: harness-quality

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  repository-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.28"

      - name: Verify lockfile is up to date
        run: uv lock --check

      - name: Install repository dependencies
        run: uv sync --frozen --all-groups

      - name: Run complete repository quality gate
        run: uv run python scripts/quality_gate.py

  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.28"

      - name: Run harness regression tests
        run: python -m unittest discover -s tests -v

      - name: Compile distributed Python
        run: >-
          python -m compileall -q bootstrap.py template/.codex/hooks template/scripts
          plugins/python-engineering-harness/scripts

      - name: Lint harness distribution
        # Lint with the ruff version locked in uv.lock, so this isolated check and the
        # repository quality gate never disagree and Dependabot updates both together.
        # --isolated ignores project config, so pin the rule set explicitly: ruff's default
        # selection grew from 59 to 407 rules in 0.17 and would change under every bump.
        run: |
          ruff_version="$(python -c 'import tomllib; lock = tomllib.load(open("uv.lock", "rb")); print(next(p["version"] for p in lock["package"] if p["name"] == "ruff"))')"
          uvx --from "ruff==${ruff_version}" ruff check --isolated --select E4,E7,E9,F bootstrap.py tests \
            template/.codex/hooks template/scripts plugins/python-engineering-harness/scripts

      - name: Reject whitespace errors
        run: git diff --check

      - name: Check sibling-harness parity manifest
        run: python scripts/parity_check.py

  generated-profiles:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        profile: [service, library, workspace]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.28"

      - name: Render profile
        # --loop renders the superset: the opt-in loop layer adds vendored code that must pass
        # each generated profile's strict lint and quality gate on every supported Python.
        run: >-
          python3 bootstrap.py --name profile-${{ matrix.profile }}
          --package profile_${{ matrix.profile }} --target ../generated
          --profile ${{ matrix.profile }} --python ${{ matrix.python-version }}
          --loop --git-init --lock

      - name: Check harness metadata and branch alignment
        run: python3 bootstrap.py --target ../generated --check

      - name: Verify generated lockfile is up to date
        if: matrix.profile == 'service'
        working-directory: ../generated
        run: uv lock --check

      - name: Frozen sync with observability
        if: matrix.profile == 'service'
        working-directory: ../generated
        run: uv sync --frozen --all-packages --all-groups --extra observability

      - name: Verify generated lockfile is up to date
        if: matrix.profile != 'service'
        working-directory: ../generated
        run: uv lock --check

      - name: Frozen sync
        if: matrix.profile != 'service'
        working-directory: ../generated
        run: uv sync --frozen --all-packages --all-groups

      - name: Run profile-owned quality gate
        working-directory: ../generated
        run: uv run python scripts/quality_gate.py

      - name: Build service runtime image
        if: matrix.profile == 'service'
        working-directory: ../generated
        run: docker build -t harness-profile-service .

      - name: Assert non-service profiles have no runtime Dockerfile
        if: matrix.profile != 'service'
        working-directory: ../generated
        run: test ! -e Dockerfile
